server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # ========================================
    # API (ASP.NET Core)
    # ========================================
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Загруженные файлы
    # ========================================
    location ^~ /uploads/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Swagger
    # ========================================
    location /swagger/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Admin static — точные пути, которые API отдаёт с корня
    # ========================================
    location = /admin.css {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin.js {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Если в HTML есть ещё ассеты с корня — добавьте их сюда же
    # location = /favicon.ico { proxy_pass http://api:8080; ... }
    # location = /admin-logo.png { proxy_pass http://api:8080; ... }

    # ========================================
    # Admin (Razor Pages в составе API)
    # ========================================
    location ~* ^/admin(/.*)?$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # React SPA
    # ========================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========================================
# Identity: страницы логина/логаута/регистрации и т.п.
# ========================================
location ^~ /Account/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
}

# ========================================
# Identity API endpoints (если включены через MapIdentityApi в .NET 8+)
# ========================================
location ^~ /identity/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
}

# ========================================
# Статические ассеты Identity UI (CSS/JS из RCL)
# путь вида /_content/Microsoft.AspNetCore.Identity.UI/...
# ========================================
location ^~ /_content/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
}
